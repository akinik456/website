<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LynraFleet | İşletmeler İçin Araç Takibi</title>

  <meta
    name="description"
    content="LynraFleet ile şirket araçlarınızı gerçek zamanlı takip edin. Ek GPS cihazı gerektirmeden canlı konum, rota geçmişi ve web paneli."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #08121f;
      color: #ffffff;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      text-decoration: none;
      color: #22D3EE;
    }

    .nav-right {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: #aeb9c6;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .panel-link {
      border: 1px solid rgba(255,255,255,0.20);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .language-switch {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .language-switch button {
      border: 0;
      background: transparent;
      color: #6f8093;
      cursor: pointer;
      font-weight: 700;
      padding: 4px;
    }

    .language-switch button.active {
      color: #ffffff;
    }

    .language-switch span {
      color: #44566b;
    }

    .hero {
      padding: 100px 0 90px;
      text-align: center;
      background:
        radial-gradient(circle at top, #153052 0%, #08121f 55%);
    }

    .eyebrow {
      color: #5db4ff;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    h1 {
      max-width: 850px;
      margin: auto;
      font-size: 52px;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    .hero-text {
      max-width: 720px;
      margin: auto;
      color: #b4c0cc;
      font-size: 19px;
    }

    .hero-buttons {
      margin-top: 38px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 15px;
    }

    .button-primary {
      background: #ffffff;
      color: #08121f;
    }

    .button-secondary {
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.22);
    }

    .benefit {
      padding: 90px 0;
      text-align: center;
    }

    .section-title {
      font-size: 35px;
      margin-bottom: 18px;
    }

    .section-description {
      max-width: 700px;
      margin: auto;
      color: #9eacbb;
      font-size: 17px;
    }

    .features-section {
      padding: 40px 0 100px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 45px;
    }

    .feature {
      background: #0d1a2a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 28px;
    }

    .feature h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .feature p {
      color: #98a7b7;
      font-size: 15px;
    }

    .panel-section {
      background: #0b1726;
      padding: 100px 0;
      text-align: center;
    }

    .screenshots {
				margin-top: 45px;
				display: grid;
				grid-template-columns: 2fr 1fr 1fr;
				gap: 18px;
				align-items: center;
			}

			.screenshots img {
				width: 100%;
				display: block;
				border-radius: 14px;
				border: 1px solid rgba(255,255,255,0.10);
				box-shadow: 0 15px 40px rgba(0,0,0,0.25);
			}

			@media (max-width: 760px) {
				.screenshots {
					grid-template-columns: 1fr;
				}
			}

    .how {
      padding: 100px 0;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-top: 50px;
    }

    .step-number {
      width: 42px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #152b44;
      border-radius: 50%;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .step h3 {
      margin-bottom: 8px;
    }

    .step p {
      color: #99a8b7;
      font-size: 15px;
    }

    .cta {
      padding: 90px 20px;
      text-align: center;
      background: #0d1b2c;
    }

    .cta h2 {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .cta p {
      color: #a6b3c1;
      margin-bottom: 30px;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      color: #6f7e8e;
      font-size: 14px;
    }

    footer a {
      color: #8fa1b5;
      text-decoration: none;
    }

    @media (max-width: 760px) {

      h1 {
        font-size: 38px;
      }

      .hero {
        padding-top: 70px;
      }

      .features,
      .steps {
        grid-template-columns: 1fr;
      }

      .nav-links a:not(.panel-link) {
        display: none;
      }

      .panel-placeholder {
        height: 260px;
      }

      .nav-right {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>

      <a href="/" class="logo">LynraFleet</a>

      <div class="nav-right">

        <div class="nav-links">
          <a href="#features" data-tr="Özellikler" data-en="Features"></a>
          <a href="#how" data-tr="Nasıl Çalışır?" data-en="How It Works"></a>
          <a
            href="/fleet/"
            class="panel-link"
            data-tr="Web Panel"
            data-en="Web Panel">
          </a>
        </div>

        <div class="language-switch">
          <button id="lang-tr" onclick="setLanguage('tr')">TR</button>
          <span>|</span>
          <button id="lang-en" onclick="setLanguage('en')">EN</button>
        </div>

      </div>

    </nav>
  </div>
</header>


<section class="hero">

  <div class="container">

    <div
      class="eyebrow"
      data-tr="İşletmeler İçin Araç Takibi"
      data-en="Vehicle Tracking for Businesses">
    </div>

    <h1
      data-tr="Şirket araçlarınızı her yerden takip edin."
      data-en="Track your company vehicles from anywhere.">
    </h1>

    <p
      class="hero-text"
      data-tr="LynraFleet, sürücünün telefonunu bir araç takip cihazına dönüştürür; filonuzu web panelinden veya mobil uygulamadan gerçek zamanlı izlemenizi sağlar."
data-en="LynraFleet turns the driver's Android phone into a vehicle tracking device, allowing you to monitor your fleet in real time from both the web panel and the mobile app."    </p>

    <div class="hero-buttons">

      <a
        href="#how"
        class="button button-primary"
        data-tr="Nasıl Çalıştığını Gör"
        data-en="See How It Works">
      </a>

      <a
        href="/fleet/"
        class="button button-secondary"
        data-tr="Web Paneli Aç"
        data-en="Open Web Panel">
      </a>

    </div>

  </div>

</section>


<section class="benefit">

  <div class="container">

    <h2
      class="section-title"
      data-tr="Ek GPS cihazı olmadan araç takibi."
      data-en="Fleet tracking without dedicated GPS hardware.">
    </h2>

    <p
      class="section-description"
      data-tr="Araçlarda zaten bulunan Android telefonları kullanın. LynraFleet, ayrı bir takip cihazı kurmadan işletmenizin araçlarını izlemesi için temel araç takip özelliklerini sunar."
      data-en="Use Android phones already available in your vehicles. LynraFleet provides the essential tools businesses need to monitor vehicles without installing a separate tracking device.">
    </p>

  </div>

</section>


<section class="features-section" id="features">

  <div class="container">

    <div class="features">

      <div class="feature">
        <h3
          data-tr="Canlı Araç Konumu"

          data-tr="Tüm araçlarınızı ve güncel konumlarını tek bir harita üzerinde görün."

      <div class="feature">

          data-tr="Rota Geçmişi"

          data-en="Review recent vehicle movements and routes from the fleet panel.">
        </p>
      </div>

      <div class="feature">
        <h3
          data-tr="Araç Durumu"

        <p

      <div class="feature">
        <h3
          data-tr="Kilometre Takibi"

        </h3>

          data-tr="Araçların kat ettiği mesafeyi tek noktadan takip edin."

      </div>

      <div class="feature">
        <h3
          data-tr="Web Filo Paneli"

        </h3>

        <p
          data-tr="Ek bir yönetim yazılımı kurmadan filonuzu masaüstü tarayıcıdan takip edin."

</section>


<section class="panel-section">

  <div class="container">

    <h2

      data-tr="Tüm filonuz tek ekranda."
      data-en="Your fleet on one screen.">

      class="section-description"
      data-tr="Araçları, konumları ve filo bilgilerini LynraFleet web panelinden görüntüleyin."
      data-en="View vehicles, locations and fleet information from the LynraFleet web panel.">

    <div class="screenshots">

		<img
			src="/assets/fleet/web-panel.png"
			alt="LynraFleet Web Panel"
		>

		<img
			src="/assets/fleet/mobile-map.png"
			alt="LynraFleet Mobile Map"
		>

		<img
			src="/assets/fleet/vehicle-list.png"
			alt="LynraFleet Vehicle List"
		>

	</div>

  </div>

</section>


<section class="how" id="how">

  <div class="container">

    <h2

      style="text-align:center;"
      data-tr="Başlamak çok kolay."

    </h2>

    <div class="steps">

      <div class="step">

        <div class="step-number">1</div>

          data-en="Install">

        <p
          data-tr="LynraFleet Vehicle uygulamasını araçta kullanılan Android telefona kurun."
          data-en="Install the LynraFleet vehicle app on the Android phone used in the vehicle.">
        </p>

      </div>


      <div class="step">

        <div class="step-number">2</div>

        <h3
          data-tr="Bağla"
          data-en="Connect">
        </h3>

        <p
          data-tr="Aracı şirketinizin LynraFleet hesabına ekleyin."
          data-en="Add the vehicle to your company's LynraFleet account.">
        </p>

      </div>


      <div class="step">

        <div class="step-number">3</div>

        <h3
          data-tr="Takip Et"
          data-en="Track">

        <p
          data-tr="Web panelini açın ve filonuzu takip etmeye başlayın."
          data-en="Open the web panel and start monitoring your fleet.">
        </p>

      </div>

    </div>

  </div>

</section>


<section class="cta">

  <h2
    data-tr="LynraFleet'i denemek ister misiniz?"
    data-en="Interested in LynraFleet?">
  </h2>

  <p
    data-tr="Daha fazla bilgi almak veya LynraFleet'i araçlarınızla denemek için bizimle iletişime geçin."
    data-en="Contact us to learn more or try LynraFleet with your vehicles.">
  </p>

  <a
    href="mailto:lynra.dev@gmail.com"
    class="button button-primary"
    data-tr="Bizimle İletişime Geçin"
    data-en="Contact Lynra">
  </a>

</section>


<footer>

  © 2026 Lynra ·
  <a
    href="/"
    data-tr="Ana Sayfa"
    data-en="Home">
  </a>
  ·
  <a
    href="/lynravehicle.html"
    data-tr="Gizlilik Politikası"
    data-en="Privacy Policy">
  </a>

</footer>


<script>
  function setLanguage(lang) {

    document.documentElement.lang = lang;

    document.querySelectorAll('[data-tr][data-en]').forEach(function(element) {
      element.textContent = element.dataset[lang];
    });

    document.getElementById('lang-tr').classList.toggle(
      'active',
      lang === 'tr'
    );

    document.getElementById('lang-en').classList.toggle(
      'active',
      lang === 'en'
    );

    localStorage.setItem('lynraLanguage', lang);

    if (lang === 'tr') {
      document.title = 'LynraFleet | İşletmeler İçin Araç Takibi';
    } else {
      document.title = 'LynraFleet | Vehicle Tracking for Businesses';
    }
  }


  const savedLanguage = localStorage.getItem('lynraLanguage');

  if (savedLanguage === 'tr' || savedLanguage === 'en') {
    setLanguage(savedLanguage);
  } else {

    const browserLanguage =
      navigator.language ||
      navigator.userLanguage ||
      'en';

    setLanguage(
      browserLanguage.toLowerCase().startsWith('tr')
        ? 'tr'
        : 'en'
    );
  }
</script>

</body>
</html>
