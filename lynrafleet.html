<script>
  function setLanguage(lang) {

  document.documentElement.lang = lang;

  // Text localization
  document.querySelectorAll('[data-tr][data-en]').forEach(function(element) {
    element.textContent = element.dataset[lang];
  });

  // Image localization
  document.querySelectorAll('[data-tr-src][data-en-src]').forEach(function(element) {
    element.src = lang === 'tr'
        ? element.dataset.trSrc
        : element.dataset.enSrc;
  });

  document.getElementById('lang-tr').classList.toggle(
    'active',
    lang === 'tr'
  );

  document.getElementById('lang-en').classList.toggle(
    'active',
    lang === 'en'
  );

  localStorage.setItem('lynraLanguage', lang);

  if (lang === 'tr') {
    document.title = 'LynraFleet | İşletmeler İçin Araç Takibi';
  } else {
    document.title = 'LynraFleet | Vehicle Tracking for Businesses';
  }
}


  const savedLanguage = localStorage.getItem('lynraLanguage');

  if (savedLanguage === 'tr' || savedLanguage === 'en') {
    setLanguage(savedLanguage);
  } else {

    const browserLanguage =
      navigator.language ||
