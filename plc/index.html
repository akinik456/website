
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>LynraControl Web BLE</title>
</head>
<body>
    <h2>LynraControl</h2>
    <button id="connectBtn">PLC'ye Bağlan</button>
    <p id="status">Bağlantı bekleniyor...</p>
		
		<button id="helloBtn" disabled>HELLO Gönder</button>

    <script>
		
				function calculateCRC32(data) {
						let crc = 0xFFFFFFFF;

						for (const byte of data) {
								crc ^= byte;

								for (let i = 0; i < 8; i++) {
										crc = (crc & 1)
												? (crc >>> 1) ^ 0xEDB88320
												: crc >>> 1;
								}
						}

						return (crc ^ 0xFFFFFFFF) >>> 0;
				}

				function buildFrame(type, seq, payload = []) {
						const frame = new Uint8Array(27 + payload.length);

						frame[0] = 0x4C;
						frame[1] = 0x43;
						frame[2] = 1;
						frame[3] = 23;
						frame[16] = type;

						for (let i = 0; i < 4; i++) {
								frame[17 + i] = (seq >>> (8 * i)) & 0xFF;
						}

						frame[21] = payload.length & 0xFF;
						frame[22] = (payload.length >>> 8) & 0xFF;
						frame.set(payload, 23);

						const crc = calculateCRC32(
								frame.subarray(2, 23 + payload.length)
						);

						const offset = 23 + payload.length;

						for (let i = 0; i < 4; i++) {
								frame[offset + i] = (crc >>> (8 * i)) & 0xFF;
						}

						return frame;
				}

        const SERVICE_UUID =
            "8d21a100-64c2-4c3a-9d1e-123456789abc";

        WRITE_UUID =
            "8d21a101-64c2-4c3a-9d1e-123456789abc";

        NOTIFY_UUID =
            "8d21a102-64c2-4c3a-9d1e-123456789abc";

        const status = document.getElementById("status");
				
				let rx = null;
				let tx = null;

				document.getElementById("helloBtn")
						.addEventListener("click", async () => {
								try {
										const frame = buildFrame(0x01, 1, []);
										await rx.writeValue(frame);
										status.textContent = "HELLO gönderildi, ACK bekleniyor...";
								} catch (error) {
										status.textContent = "HELLO hatası: " + error.message;
								}
						});

        document.getElementById("connectBtn")
            .addEventListener("click", async () => {
                try {
                    status.textContent = "PLC aranıyor...";

                    const device =
                        await navigator.bluetooth.requestDevice({
                            filters: [{ name: "LynraControl" }],
                            optionalServices: [SERVICE_UUID]
                        });

                    status.textContent = "Bağlanıyor...";

                    const server = await device.gatt.connect();

                    const service =
                        await server.getPrimaryService(SERVICE_UUID);

                    const rx =
                        await service.getCharacteristic(WRITE_UUID);

                    const tx =
                        await service.getCharacteristic(NOTIFY_UUID);

                    await tx.startNotifications();
										
										tx.addEventListener("characteristicvaluechanged", (event) => {
											const data = new Uint8Array(event.target.value.buffer,
													event.target.value.byteOffset,
													event.target.value.byteLength);

											if (data.length >= 27 &&
													data[0] === 0x4C &&
													data[1] === 0x43 &&
													data[16] === 0x02) {
													status.textContent = "HELLO → ACK alındı!";
											}
									});

									document.getElementById("helloBtn").disabled = false;

                    status.textContent =
                        "BLE bağlantısı başarılı: " + device.name;

                    console.log("RX:", rx);
                    console.log("TX:", tx);
                }
                catch (error) {
                    status.textContent =
                        "Hata: " + error.message;
                    console.error(error);
                }
            });
    </script>
</body>
</html>
